<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MailFeed</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fb;--sf:#fff;--ink:#0f172a;--mut:#64748b;--line:#e8eaf2;--brand:#6d5efc;--job:#3b6cff;--due:#f59e0b;--gen:#94a3b8;--sh:0 1px 2px #0f172a0a,0 8px 24px #0f172a0d}
@media(prefers-color-scheme:dark){:root{--bg:#0a0d14;--sf:#131824;--ink:#e9edf5;--mut:#8a94a8;--line:#222a3b;--sh:0 1px 2px #0006,0 8px 24px #0004}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
svg{flex:none}
.logo{font-weight:800;letter-spacing:-.04em;font-size:22px;display:flex;align-items:center;gap:8px}
.logo i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--brand),#ec4899);display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
/* ---------- login ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:linear-gradient(145deg,#4338ca,#7c3aed 55%,#ec4899);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.hero h2{font-size:clamp(32px,4vw,52px);line-height:1.05;letter-spacing:-.04em;margin:0 0 16px;font-weight:800}
.hero p{opacity:.85;max-width:440px;font-size:17px;margin:0}
.pills{display:flex;flex-wrap:wrap;gap:8px}.pills span{background:#ffffff26;backdrop-filter:blur(6px);padding:7px 13px;border-radius:99px;font-size:13px;font-weight:500}
.formwrap{display:grid;place-items:center;padding:32px}
.form{width:100%;max-width:400px}
.form h1{font-size:28px;letter-spacing:-.03em;margin:0 0 6px}.form>p{color:var(--mut);margin:0 0 24px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--sf);outline:0;transition:.15s}
input:focus{border-color:var(--brand);box-shadow:0 0 0 4px #6d5efc22}
.hint{font-size:12.5px;color:var(--mut);margin-top:8px;min-height:18px}
.hint a{color:var(--brand)}
details{margin-top:12px;font-size:13px;color:var(--mut)}summary{cursor:pointer}
.btn{width:100%;margin-top:20px;padding:14px;border-radius:12px;background:var(--brand);color:#fff;font-weight:600;transition:.15s}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.6;cursor:wait}
.err{margin-top:14px;padding:11px 14px;border-radius:12px;background:#ef44441a;color:#dc2626;font-size:13.5px;display:none}
.safe{font-size:12px;color:var(--mut);margin-top:18px;text-align:center}
/* ---------- app ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top>div{max-width:680px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:8px}
.sp{flex:1}
.ib{height:38px;min-width:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;color:var(--mut);font-size:13px;font-weight:500;transition:.15s}
.ib:hover{background:var(--sf);color:var(--ink)}.ib.on{color:var(--brand);background:#6d5efc1a}
.acct{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:680px;margin:auto;padding:0 16px 80px}
h4{margin:22px 4px 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700}
.stories{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:136px;height:176px;border-radius:22px;padding:14px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start;background:linear-gradient(150deg,#4f46e5,#7c3aed 60%,#ec4899);box-shadow:var(--sh);transition:.2s;position:relative;overflow:hidden}
.story:nth-child(3n+2){background:linear-gradient(150deg,#0ea5e9,#3b6cff 70%)}.story:nth-child(3n){background:linear-gradient(150deg,#f97316,#ef4444 70%,#ec4899)}
.story:hover{transform:translateY(-3px)}
.story .e{font-size:30px;line-height:1}.story b{font-size:15px;line-height:1.2;letter-spacing:-.02em;display:block}
.story small{opacity:.85;font-size:12px;display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:6px;margin:20px 0 14px;overflow-x:auto;scrollbar-width:none}
.tab{padding:8px 15px;border-radius:99px;font-weight:600;font-size:13.5px;color:var(--mut);background:var(--sf);border:1px solid var(--line);white-space:nowrap;transition:.15s}
.tab em{font-style:normal;opacity:.6;margin-left:5px;font-weight:500}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--sf);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);position:relative;transition:box-shadow .3s,transform .3s}
.card:before{content:"";position:absolute;left:0;top:22px;bottom:22px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.t1{--c:var(--job)}.t2{--c:var(--due)}.t3{--c:var(--gen)}
.card.flash{box-shadow:0 0 0 3px var(--brand)}
.card.out{opacity:0;transform:scale(.97) translateY(-6px)}
.hd{display:flex;align-items:center;gap:11px}
.av{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.who{flex:1;min-width:0;line-height:1.25}.who b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who span{font-size:12.5px;color:var(--mut)}
.badge{font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;white-space:nowrap;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.t3 .badge{color:var(--mut)}
.card h3{margin:14px 0 4px;font-size:17.5px;line-height:1.3;letter-spacing:-.02em}
.card p{margin:0;color:var(--mut)}
.ev{display:flex;align-items:center;gap:12px;margin-top:14px;padding:11px 13px;border-radius:14px;background:var(--bg)}
.ev .ci{width:34px;height:34px;border-radius:11px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);display:grid;place-items:center}
.ev div{flex:1;line-height:1.3;font-size:13.5px}.ev small{display:block;color:var(--mut);font-size:12.5px}
.reg{background:var(--ink);color:var(--bg);padding:8px 13px;border-radius:10px;font-size:13px;font-weight:600;text-decoration:none;display:inline-flex;gap:5px;align-items:center}
.ft{display:flex;align-items:center;gap:2px;margin-top:12px;margin-left:-8px}
.ft .ib{height:36px}.ft .ib:disabled{opacity:.35;pointer-events:none}.ft .del:hover{color:#ef4444;background:#ef44441a}
.sk{height:150px;border-radius:22px;background:linear-gradient(90deg,var(--sf) 25%,var(--line) 50%,var(--sf) 75%);background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:14px}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}.empty b{display:block;color:var(--ink);font-size:18px;margin:8px 0 4px}.empty .big{font-size:42px}
.empty button{margin-top:14px;padding:9px 16px;border-radius:99px;background:var(--brand);color:#fff;font-weight:600}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.spin{animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
@media(max-width:820px){.auth{grid-template-columns:1fr}.hero{padding:28px;min-height:230px;gap:20px}.hero p{display:none}}
</style></head><body>
<div id="root"></div><div class="toast" id="toast"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P={bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
arch:'<rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4"/>',
trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',ext:'<path d="M7 17 17 7M7 7h10v10"/>',
ref:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>',
out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
g:'<circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/>'};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const S={user:null,mails:[],stories:[],tab:"all",timer:null,loading:false};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return`hsl(${h} 62% 48%)`};
const z=d=>new Date(d).toISOString().replace(/[-:]|\.\d{3}/g,"");
function toast(t,ms=2400){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),ms)}
function ago(ts){if(!ts)return"";const m=(Date.now()/1e3-ts)/60;return m<1?"just now":m<60?`${m|0}m ago`:m<1440?`${m/60|0}h ago`:`${m/1440|0}d ago`}
function when(iso){const d=new Date(iso),h=(d-Date.now())/36e5;
 const l=d.toLocaleString([],{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
 const c=h<1?"starting soon":h<24?`in ${Math.round(h)}h`:`in ${Math.round(h/24)} days`;return{l,c}}
async function api(p,o={}){const r=await fetch(p,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...o});
 if(r.status===401&&p!=="/login"){showLogin();throw new Error("auth")}
 if(!r.ok){let m;try{m=(await r.json()).detail}catch{m=r.statusText}throw new Error(m)}return r.json()}

/* ---------- login ---------- */
const HINTS={"gmail.com":'Gmail: create an <a target=_blank href="https://myaccount.google.com/apppasswords">app password</a> (needs 2-Step Verification).',
"yahoo.com":'Yahoo: generate an <a target=_blank href="https://login.yahoo.com/account/security">app password</a> in Account Security.',
"icloud.com":'iCloud: create an <a target=_blank href="https://account.apple.com">app-specific password</a>.',
"outlook.com":"Outlook/Hotmail may block app passwords. If login fails, this provider isn't supported yet.",
"hotmail.com":"Outlook/Hotmail may block app passwords. If login fails, this provider isn't supported yet."};
function showLogin(){clearInterval(S.timer);S.user=null;
$("#root").innerHTML=`<div class="auth"><section class="hero"><div class="logo"><i>✉</i>MailFeed</div>
<div><h2>Your inbox,<br>ranked by what matters.</h2><p>Internships and job updates first. Deadlines next. Everything summarised in a line, with a ping when something big lands.</p></div>
<div class="pills"><span>🚀 Internship alerts</span><span>📅 Auto calendar</span><span>⚡ AI summaries</span><span>🔕 Noise hidden</span></div></section>
<section class="formwrap"><form class="form" id="lf"><h1>Sign in</h1><p>Use any email account — Gmail, Yahoo, iCloud and more.</p>
<label>Email</label><input id="em" type="email" autocomplete="username" required placeholder="you@gmail.com">
<div class="hint" id="hint"></div>
<label>App password</label><input id="pw" type="password" autocomplete="current-password" required placeholder="16-letter app password">
<details><summary>Advanced</summary><label>IMAP server (optional)</label><input id="host" placeholder="e.g. imap.gmail.com"></details>
<div class="err" id="err"></div><button class="btn" id="go">Continue</button>
<div class="safe">🔒 Your password is held in server memory for this session only and never written to disk.</div></form></section></div>`;
$("#em").oninput=e=>{$("#hint").innerHTML=HINTS[e.target.value.split("@")[1]?.toLowerCase()]||""};
$("#lf").onsubmit=async e=>{e.preventDefault();const b=$("#go"),er=$("#err");er.style.display="none";b.disabled=true;b.textContent="Signing in…";
 try{const r=await api("/login",{method:"POST",body:JSON.stringify({email:$("#em").value,password:$("#pw").value,host:$("#host").value||null})});S.user=r.email;showApp()}
 catch(x){er.textContent=x.message;er.style.display="block";b.disabled=false;b.textContent="Continue"}}}

/* ---------- app shell ---------- */
const notifOn=()=>"Notification" in window&&Notification.permission==="granted"&&localStorage.getItem("notif")!=="0";
function showApp(){
$("#root").innerHTML=`<div class="top"><div><div class="logo"><i>✉</i>MailFeed</div><span class="sp"></span>
<button class="ib" id="rf" title="Refresh">${ic("ref")}</button><button class="ib" id="bell" title="Alerts">${ic("bell")}</button>
<span class="ib acct" title="${esc(S.user)}">${esc(S.user)}</span><button class="ib" id="lo" title="Sign out">${ic("out")}</button></div></div>
<main class="wrap"><div id="st"></div><div class="tabs" id="tabs"></div><div id="feed"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></main>`;
$("#rf").onclick=()=>load(false);$("#lo").onclick=async()=>{await api("/logout",{method:"POST"}).catch(()=>{});showLogin()};
$("#bell").onclick=toggleNotif;paintBell();
$("#feed").onclick=onAct;$("#st").onclick=e=>{const b=e.target.closest("[data-go]");if(b)jump(b.dataset.go)};
$("#tabs").onclick=e=>{const t=e.target.closest("[data-t]");if(t){S.tab=t.dataset.t;paint()}};
load(false);clearInterval(S.timer);S.timer=setInterval(()=>load(true),60000)}
function paintBell(){const b=$("#bell");if(b)b.classList.toggle("on",notifOn())}
async function toggleNotif(){
 if(!("Notification" in window))return toast("This browser doesn't support notifications");
 if(notifOn()){localStorage.setItem("notif","0");paintBell();return toast("Alerts off")}
 const p=Notification.permission==="granted"?"granted":await Notification.requestPermission();
 if(p!=="granted")return toast("Notifications are blocked — allow them in your browser's site settings",4000);
 localStorage.setItem("notif","1");paintBell();new Notification("🔔 Alerts are on",{body:"We'll ping you when jobs, internships or deadlines arrive."})}

/* ---------- data ---------- */
async function load(silent){if(S.loading)return;S.loading=true;
 const ic_=$("#rf svg");if(ic_)ic_.classList.add("spin");
 try{const d=await api("/feed");S.mails=d.feed;S.stories=d.stories;const fresh=diff(d.feed);paint();if(fresh.length)alerts(fresh)}
 catch(e){if(e.message!=="auth"&&!silent&&$("#feed"))$("#feed").innerHTML=`<div class="empty"><div class="big">😕</div><b>Couldn't load your emails</b>${esc(e.message)}<br><button onclick="load(false)">Try again</button></div>`}
 finally{S.loading=false;$("#rf svg")?.classList.remove("spin")}}
function diff(mails){const k="seen:"+S.user,had=localStorage.getItem(k);
 const seen=new Set(JSON.parse(had||"[]"));localStorage.setItem(k,JSON.stringify(mails.map(m=>m.id)));
 return had?mails.filter(m=>!seen.has(m.id)&&m.priority<3):[]}
function alerts(f){
 if(notifOn())f.slice(0,3).forEach(m=>{const e=m.events[0],w=e?` · ${when(e.start).c}`:"";
  const n=new Notification(`${m.hook.icon} ${m.hook.label}`,{body:`${m.sender}${w}\n${m.summary.slice(0,90)}`,tag:m.id});
  n.onclick=()=>{focus();jump(m.id);n.close()}});
 toast(`${f[0].hook.icon} ${f[0].hook.label}${f.length>1?` +${f.length-1} more`:""}`,4000)}

/* ---------- render ---------- */
function paint(){
 const c={all:S.mails.length,1:0,2:0,3:0};S.mails.forEach(m=>c[m.priority]++);
 $("#st").innerHTML=S.stories.length?`<h4>Needs attention</h4><div class="stories">${S.stories.map(m=>{const e=m.events[0];
  return`<button class="story" data-go="${m.id}"><span class="e">${m.hook.icon}</span><span><b>${esc(m.hook.label)}</b><small>${esc(m.sender)}</small>${e?`<small>${when(e.start).c}</small>`:""}</span></button>`}).join("")}</div>`:"";
 $("#tabs").innerHTML=[["all","All"],["1","Jobs"],["2","Deadlines"],["3","Other"]].map(([k,l])=>`<button class="tab ${S.tab===k?"on":""}" data-t="${k}">${l}<em>${c[k]}</em></button>`).join("");
 const list=S.tab==="all"?S.mails:S.mails.filter(m=>m.priority==S.tab);
 $("#feed").innerHTML=list.length?list.map(card).join(""):`<div class="empty"><div class="big">🎉</div><b>All clear</b>Nothing here right now.</div>`}
function card(m){const e=m.events[0],w=e&&when(e.start);
 return`<article class="card t${m.priority}" id="m${m.id}"><div class="hd"><div class="av" style="background:${hue(m.sender)}">${esc((m.sender[0]||"?").toUpperCase())}</div>
 <div class="who"><b>${esc(m.sender)}</b><span>${ago(m.timestamp)}</span></div><span class="badge">${m.hook.icon} ${esc(m.hook.label)}</span></div>
 <h3>${esc(m.subject)}</h3><p>${esc(m.summary)}</p>
 ${e?`<div class="ev"><span class="ci">${ic("clock",17)}</span><div><b>${w.l}</b><small>${w.c}</small></div>${e.url?`<a class="reg" target="_blank" rel="noopener" href="${esc(e.url)}">Register ${ic("ext",14)}</a>`:""}</div>`:""}
 <div class="ft"><button class="ib" data-a="ics" data-id="${m.id}" ${e?"":"disabled"}>${ic("cal")} Add to calendar</button>
 <button class="ib" data-a="gcal" data-id="${m.id}" ${e?"":"disabled"}>Google</button><span class="sp"></span>
 <button class="ib" data-a="archive" data-id="${m.id}" title="Archive">${ic("arch")}</button>
 <button class="ib del" data-a="delete" data-id="${m.id}" title="Delete">${ic("trash")}</button></div></article>`}
function jump(id){const el=document.getElementById("m"+id);if(!el){S.tab="all";paint()}
 const t=document.getElementById("m"+id);if(!t)return;t.scrollIntoView({behavior:"smooth",block:"center"});t.classList.add("flash");setTimeout(()=>t.classList.remove("flash"),1600)}

/* ---------- actions ---------- */
function onAct(e){const b=e.target.closest("[data-a]");if(!b)return;const m=S.mails.find(x=>x.id===b.dataset.id);if(!m)return;
 const ev=m.events[0];
 if(b.dataset.a==="gcal")return open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(ev.title)}&dates=${z(ev.start)}/${z(ev.end)}&details=${encodeURIComponent(ev.url||"")}`,"_blank");
 if(b.dataset.a==="ics"){const t=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//MailFeed//EN","BEGIN:VEVENT",`UID:${m.id}-${z(ev.start)}@mailfeed`,`DTSTAMP:${z(new Date())}`,
  `DTSTART:${z(ev.start)}`,`DTEND:${z(ev.end)}`,`SUMMARY:${ev.title.replace(/[\r\n,;]/g," ")}`,ev.url?`DESCRIPTION:Details: ${ev.url}`:"","BEGIN:VALARM","TRIGGER:-PT1H","ACTION:DISPLAY","DESCRIPTION:Reminder","END:VALARM","END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/calendar"}));a.download="event.ics";a.click();return toast("Calendar file downloaded — open it to add the event",3200)}
 const kind=b.dataset.a,card=document.getElementById("m"+m.id);card.classList.add("out");
 api(kind==="archive"?`/emails/${m.id}/archive`:`/emails/${m.id}`,{method:kind==="archive"?"POST":"DELETE"})
  .then(()=>{S.mails=S.mails.filter(x=>x.id!==m.id);S.stories=S.stories.filter(x=>x.id!==m.id);setTimeout(paint,250);toast(kind==="archive"?"Archived":"Moved to Trash")})
  .catch(x=>{card.classList.remove("out");toast("Failed: "+x.message,4000)})}
api("/me").then(r=>{S.user=r.email;showApp()}).catch(showLogin);
</script></body></html>
